# Entorno local de desarrollo: PostgreSQL.
# Uso:  docker compose -f infra/docker-compose.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: emenu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: emenu
      POSTGRES_PASSWORD: emenu
      POSTGRES_DB: emenu
    ports:
      - "5432:5432"
    volumes:
      - emenu-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emenu -d emenu"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  emenu-pgdata:
