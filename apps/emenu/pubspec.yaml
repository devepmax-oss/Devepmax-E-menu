name: devepmax_emenu
description: Devepmax E-Menu — menú en la tablet de la mesa.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  devepmax_ui:
    path: ../packages/ui

  cupertino_icons: ^1.0.8
  collection: ^1.19.1
  dio: ^5.9.2
  flutter_riverpod: ^3.3.1
  flutter_secure_storage: ^10.0.0
  intl: ^0.20.2
  mobile_scanner: ^7.0.0
  socket_io_client: ^3.1.2
  wakelock_plus: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
