name: devepmax_driver
description: Devepmax E-Menu — app del repartidor.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  devepmax_ui:
    path: ../packages/ui

  cupertino_icons: ^1.0.8
  audioplayers: ^6.6.0
  dio: ^5.9.2
  flutter_riverpod: ^3.3.1
  flutter_secure_storage: ^10.0.0
  geolocator: ^14.0.2
  intl: ^0.20.2
  socket_io_client: ^3.1.2
  url_launcher: ^6.3.2
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
