name: devepmax_staff
description: Devepmax E-Menu — app del restaurante (POS, cocina, mesero y administración).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  devepmax_ui:
    path: ../packages/ui

  cupertino_icons: ^1.0.8
  collection: ^1.19.1
  dio: ^5.9.2
  flutter_riverpod: ^3.3.1
  flutter_secure_storage: ^10.0.0
  go_router: ^17.1.0
  image_picker: ^1.2.1
  intl: ^0.20.2
  flutter_native_splash: ^2.4.8
  socket_io_client: ^3.1.2
  # Se agregan en su fase, con versiones actuales:
  #   Fase 2: firebase_core, firebase_messaging, sonidos
  #   Fase 4: impresión ESC/POS

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/

flutter_native_splash:
  color: "#000000"        # Color de fondo
  image: assets/images/logo.png   # Logo que quieres mostrar
  android: true            # Generar splash para Android
  ios: true                # Generar splash para iOSf


  image_path: assets/images/logo.png

  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/images/logo.png

  min_sdk_android: 21